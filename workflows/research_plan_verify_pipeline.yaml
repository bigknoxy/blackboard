id: research_plan_verify_pipeline
name: Generic Research, Planning & Iterative Verification Pipeline
description: >
  Generic iterative workflow for any research, planning, or backlog-building request:
  Researcher gathers grounded evidence -> Architect synthesizes structured plan & backlog items ->
  QA Tester verifies quality and completeness, looping back (REWORK) until PASS.
capability_tags:
  - research
  - planning
  - web_search
  - deliverable_synthesis
  - quality_verification
required_tools:
  - web_search
  - repo_search
input_contract:
  type: research_request
  source_type: search_query
  required_fields:
    - research_question
output_contract:
  type: verified_research_plan
  target_type: search_results
  required_fields:
    - grounded_evidence
    - deliverable
    - quality_verdict
nodes:
  - id: start_research_plan
    name: Research & Planning Request Received
    type: StartEvent

  - id: stage_deep_research
    name: Deep Research & Evidence Gathering
    type: ServiceTask
    agent_id: researcher
    entry_type: research
    required_tools:
      - web_search
    prompt_template: >
      Conduct thorough research on the operator's exact request using live web search results.
      Gather concrete options, real product names, approximate prices, and clickable Markdown links
      ([Title](https://...)) directly from the web search evidence. Never invent fake URLs.
      If this is a REWORK iteration, address every gap identified in the QA critique.

  - id: stage_architect_plan
    name: Human-Friendly Deliverable & Plan Synthesis
    type: ServiceTask
    agent_id: architect
    entry_type: spec
    required_tools:
      - repo_search
    prompt_template: >
      Synthesize the researcher's findings into a clear, human-friendly final deliverable tailored
      to what the operator actually asked for.
      - If the operator asked for a shopping list, hardware build, or product recommendations:
        present a clean, readable shopping list with exact item names, clickable Markdown product links
        from the research findings, approximate prices, total estimated cost, and beginner/compatibility notes
        (do NOT use Jira ticket jargon like P0/P1 or Acceptance Criteria).
      - If the operator asked for a software/architecture plan: present a clear prioritized plan with
        concrete technical steps and acceptance criteria.
      Include every requirement the operator mentioned (e.g., no-solder, battery option, links).

  - id: stage_verify_quality
    name: Iterative Quality & Completeness Verification
    type: ServiceTask
    agent_id: qa-tester
    entry_type: critique
    required_tools:
      - repo_search
    prompt_template: >
      Verify the final deliverable against the operator's original request from a human's perspective.
      Check that: (1) every constraint requested by the operator is covered (e.g., links, battery, no-solder),
      (2) clickable URLs are included when links were requested, and (3) the formatting is readable and helpful.
      Respond with PASS if complete and helpful, or REWORK listing the exact missing items.

  - id: gateway_verify_quality
    name: Quality Verification Verdict
    type: ExclusiveGateway

  - id: end_research_plan
    name: Verified Research & Plan Complete
    type: EndEvent

edges:
  - id: rpv_1
    source: start_research_plan
    target: stage_deep_research
  - id: rpv_2
    source: stage_deep_research
    target: stage_architect_plan
  - id: rpv_3
    source: stage_architect_plan
    target: stage_verify_quality
  - id: rpv_4
    source: stage_verify_quality
    target: gateway_verify_quality
  - id: rpv_5_pass
    source: gateway_verify_quality
    target: end_research_plan
    condition: PASS
  - id: rpv_5_rework
    source: gateway_verify_quality
    target: stage_deep_research
    condition: REWORK
