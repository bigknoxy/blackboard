services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blackboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackboard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-blackboard_db}
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "max_connections=100"
    ports:
      - "0.0.0.0:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackboard} -d ${POSTGRES_DB:-blackboard_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: blackboard-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    ports:
      - "0.0.0.0:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: blackboard-control-plane
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://blackboard:blackboard_secret@postgres:5432/blackboard_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOCAL_OLLAMA_URL: ${LOCAL_OLLAMA_URL:-http://192.168.1.150:11434}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-qwen2.5-coder:7b}
      WORKFLOWS_DIR: /workflows
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./control-plane/app:/app/app
      - ./workflows:/workflows
      - ./tests:/app/tests
      - ./agent-worker/app:/app/agent_worker_app
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-worker:
    build:
      context: ./agent-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://blackboard:blackboard_secret@postgres:5432/blackboard_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control-plane:8000}
      LOCAL_OLLAMA_URL: ${LOCAL_OLLAMA_URL:-http://192.168.1.150:11434}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-qwen2.5-coder:7b}
    volumes:
      - ./agent-worker/app:/app/app
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      control-plane:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  web-cockpit:
    build:
      context: ./web-cockpit
      dockerfile: Dockerfile
    container_name: blackboard-web-cockpit
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_WS_URL: ${VITE_WS_URL:-}
    ports:
      - "0.0.0.0:5173:5173"
    volumes:
      - ./web-cockpit/src:/app/src
    depends_on:
      - control-plane
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  redisdata:
